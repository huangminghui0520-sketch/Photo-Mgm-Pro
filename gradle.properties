# 单根构建的全局 Gradle 配置（M2 新增，值合并自 android/gradle.properties 与 desktop/gradle.properties；
# 那两个文件在 M4 删除，单根下 Gradle 只读仓库根这一份）。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ★ AGP 必需，漏了会直接构建失败（原 android/gradle.properties）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 桌面侧（原 desktop/gradle.properties）
kotlin.code.style=official
# 源文件统一 UTF-8（中文注释/文案在 Windows 默认 GBK 下会乱码）
kotlin.incremental=true

# ★ 不启用 org.gradle.configureondemand：与 AGP 有已知不兼容，
#   需 CI 实跑验证后再议（方案 §3.2 L2）。M2/M3 保持关闭 —— 即「不写这一行」。
