name: CI

# 与 Build APK（build-apk.yml，只出包）分开的两类检查：
#   1. static-guards：纯 python3，几秒钟出结果，在编译之前拦住三类"人肉 review 靠不住"的问题
#      ——吞掉协程取消信号、被跳过的测试不可溯源（@Ignore/@Disabled 必须带 issue 编号，
#      assumeTrue/assumeFalse 逐条统计并列出原因）、隐式依赖设备默认时区；
#   2. unit-test：**一条 `gradle testAll` 覆盖全部 8 个模块**——
#      shared:algorithm/domain/app（纯 JVM）+ desktop:core/ui（JVM）+ android:data/app（Robolectric）
#      （M3 单根化后由根 build.gradle.kts 的 testAll 统一接线；M0 之前只有 2 个任务被接进来，
#      188 个 @Test 零门禁）。
# ★ 必须监听 pull_request：否则分支上的检查只有推送到 main 才跑，PR 里永远是空的。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-guards:
    name: Static guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ★ 三条"可重现性前提"（2026-10-31 复核）：
      #   ① python3 存在（ubuntu-24.04 预装；脚本只用标准库，不开线程、不读环境变量、不联网）；
      #   ② 脚本真的进了仓库——.gitignore 里有全局 `*.py`，靠 `!scripts/*.py` 白名单放行，
      #      白名单一旦失效，CI checkout 里根本没有这个文件，报错会是"can't open file"，
      #      看不出根因，所以在这里显式断言；
      #   ③ 脚本不依赖调用方 cwd（内部按仓库根解析相对路径），换 runner / 换 job 都成立。
      - name: 可重现性前提
        run: |
          python3 --version
          git ls-files --error-unmatch scripts/check-cancellation.py
          git ls-files --error-unmatch scripts/check-ignore-policy.py
          git ls-files --error-unmatch scripts/check-timezone.py
          git ls-files --error-unmatch scripts/check-shared-purity.py

      # ★ 先跑内置样例自测：确认"判据本身没有退化"。
      #   门禁是自制词法分析器，没有外部依赖可对拍，最危险的回归是"规则还在、判据失效"
      #   ——表现是永远绿。自测覆盖：该报的必须报、不该报的不能报、
      #   CRLF 与 LF 判定结果完全一致（core.autocrlf 的换行差异不得影响行号/括号深度）。
      - name: 判据自测
        run: |
          python3 scripts/check-cancellation.py --selftest
          python3 scripts/check-ignore-policy.py --selftest
          python3 scripts/check-timezone.py --selftest
          python3 scripts/check-shared-purity.py --selftest

      # ★ 结构约束（M3/M4 收尾后重写）：共享层唯一物理源码 + 8 个项目由根 settings 纳入
      #   + 无容器项目脚本残留 + 无双根构建文件残留。最可能被误做的五件事：
      #     ① 把 shared/ 复制进 android/ 或 desktop/ 下（两份实现必然漂移）；
      #     ② 8 个模块没被根 settings 纳入（漏挂 = 悄悄不编译、不跑测试）；
      #     ③ shared/<mod>/build.gradle.kts 被移动（源码位置是"产物路径零变化"的前提）；
      #     ④ 容器项目脚本残留：include(":android:app") 会让 Gradle 把 :android 当容器项目，
      #        其目录下若还有旧的 android/build.gradle.kts（带字面 version 的 plugins 声明），
      #        会与根 build.gradle.kts 的 alias(...) apply false 在**配置阶段**冲突；
      #     ⑤ 双根复活：两端各自的 gradle.properties / wrapper 又被人加回来。
      #   ★ R-02 通则：本 step **只断言本次改动内已删除的文件**（M3 的 4 个根脚本 + M4 的 10 项），
      #     不断言"尚未删除"的文件，否则第一次 CI 必红。
      #   ★ 下面文件清单里出现的 wrapper 脚本文件名是**存在性断言**，不是调用；
      #     G10 判据的本意是"workflow 不得以 wrapper 脚本或 `-p <子根>` 的形式调用 gradle"，
      #     因此该判据必须只判**调用行**：裸 grep 文件名会把本清单这些行一起算进去，
      #     属"判据 pattern 与断言文本重叠"。统一判据是只看 `run:` 行是否以 wrapper 或子根形式调用
      #     gradle（完整命令见 `docs/REPO-LAYOUT.md` §2.9），**不要**拿裸文件名去做 grep。
      - name: 结构约束（单根 8 项目 + 共享层唯一）
        run: |
          for d in android/algorithm android/shared desktop/shared; do
            if [ -e "$d" ]; then
              echo "✗ $d 不应存在：共享代码只能在仓库根的 shared/ 下，8 个项目由根 settings 纳入"; exit 1
            fi
          done
          for f in settings.gradle.kts build.gradle.kts gradle.properties \
                   gradlew gradlew.bat gradle/libs.versions.toml \
                   gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -e "$f" ]; then echo "✗ 缺根构建文件：$f"; exit 1; fi
          done
          for f in android/settings.gradle.kts android/build.gradle.kts \
                   desktop/settings.gradle.kts desktop/build.gradle.kts; do
            if [ -e "$f" ]; then echo "✗ M3 残留（容器项目脚本，会与根 alias 冲突）：$f"; exit 1; fi
          done
          # ★ M4 后登记：两端各自的 gradle.properties + wrapper 脚本 + wrapper 目录，共 10 项。
          #   目的：防「双根复活」——任何人再把 android/ 或 desktop/ 当成独立 Gradle 根，
          #   这 5 类文件必然先出现（wrapper 一生成就会带上 gradle.properties 与 gradle/wrapper/），
          #   这里立刻拦下，而不是等 CI 跑到一半才发现构建了两套、产物互相覆盖。
          for f in android/gradle.properties desktop/gradle.properties \
                   android/gradlew desktop/gradlew \
                   android/gradlew.bat desktop/gradlew.bat \
                   android/gradle/wrapper desktop/gradle/wrapper; do
            if [ -e "$f" ]; then echo "✗ M4 残留（双根复活）：$f"; exit 1; fi
          done
          for p in ':shared:algorithm' ':shared:domain' ':shared:app' \
                   ':android:data' ':android:app' \
                   ':desktop:core' ':desktop:cli' ':desktop:ui'; do
            grep -Fq "include(\"$p\")" settings.gradle.kts \
              || { echo "✗ 根 settings 未 include $p"; exit 1; }
          done
          for mod in algorithm domain app; do
            if [ ! -f "shared/$mod/build.gradle.kts" ]; then
              echo "✗ shared/$mod 源码被移动/复制"; exit 1
            fi
          done
          echo "✓ 单根 8 项目 + shared/ 唯一物理源码 + 无容器项目脚本残留 + 无双根构建文件残留"

      # ★ M1（I-04）：这里**不再传路径**，一律走各脚本的默认根。
      #   原因：位置参数会**覆盖**默认根，CI 若继续写 `android/app shared android/data`，
      #   脚本默认根里新补的 desktop 就永远用不上。M1 之前 cancellation / ignore-policy /
      #   timezone 三个行为门禁完全不扫 desktop（80 个 .kt、其中 23 个测试文件），
      #   补上后 desktop 新增违规才会被 PR 拦住。（purity 的 PROD_ROOTS/UI_ROOTS 本来就含
      #   desktop main，不属此缺口。）各脚本都会在输出里打印"扫了多少文件"，CI 日志可直接核对。
      - name: 扫描 Kotlin 源码
        run: |
          python3 scripts/check-cancellation.py
          python3 scripts/check-ignore-policy.py
          python3 scripts/check-timezone.py
          python3 scripts/check-shared-purity.py

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    # ★ TZ 固定为兜底，**不是正确性依据**（issue #2 决策）。
    #   历史：runner 默认 UTC，而生产代码曾有 7 处 ZoneId.systemDefault() 把 epoch 解释成本地
    #   时间 → 台账日期列偏移 8 小时、"当日零点"边界错位（CI 首次跑测试即 5 条红）。
    #   现在生产代码一律显式用 algorithm.AppZone.ID（Asia/Shanghai），并由
    #   scripts/check-timezone.py 在 static-guards 里拦截"再写回 systemDefault()"；
    #   测试侧用 TimeZone.setDefault 在进程内切换默认时区做验证，不依赖本变量。
    #   保留它只为兜住"漏网的隐式依赖"在 CI 上不会表现成随机红。
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # ★ 依赖真实照片的 VM 用例（AppViewModelTest / ExifMergedReaderTest 等）拿不到源照片时
      #   会用 assumeTrue 跳过，所以本 job 在无照片的 runner 上是绿的。**但"绿"不等于"跑过"**：
      #   assumeTrue 属 **运行期跳过**（用例被标 skipped，不是 failure），退出码与 Gradle
      #   汇总都不区分"跳过"和"通过"。
      #   `scripts/check-ignore-policy.py` 的 [SKIP-SCAN] 有两层口径：
      #     · 源码侧（static-guards 里跑）：逐条打印调用点 path:line + 原因串，规则 S1/S2 要求
      #       原因串非空且含 [SKIP-SCAN] / #<issue> / ci-ok 标记，否则判红；
      #     · 运行期侧（下面 --xml 那一步）：解析 JUnit XML，按模块打印 tests/failures/
      #       errors/skipped 并逐条列出 skipped 的 类#方法。
      #   二者缺一不可：只有源码清单时，Linux 上样本缺失的 8 个用例会静默 skipped，
      #   CI 绿了但覆盖为零（I-02「空真绿灯」的翻版）。
      #   ★ 加 --continue：首个失败任务不再中止整条 gradle，8 个模块都产出 XML，
      #     "仅这 N 个失败 / 其余 M 例通过"才是可复算的结论，而不是靠控制台猜。
      #     ★★ 口径必须写死（任何交付描述沿用原句）：
      #     「--continue 只保证失败时后续任务继续产出 XML，不改变 job 最终状态；
      #       若出现失败任务，job 仍为 failure，红色应读作归因窗口，不是回归信号。」
      #     job 的最终状态仍由失败任务决定 = failure；--continue 不改变这一点。
      # ★ M3（单根化）：仓库根就是唯一的 Gradle 根，不再需要 -p 指定子工程。
      #   旧的「android/ 是独立工程、必须 -p android」注释已作废（那套双根拓扑已删除）。
      #   一条 `gradle testAll` 覆盖 8 个模块，接线清单在根 build.gradle.kts 的 testAll
      #   —— 把"哪些模块的测试要跑"变成**构建脚本里的一处显式清单**，而不是 workflow 里
      #   一份容易漏改的任务串（M0 之前的 P0 就是漏了 3 个模块）。
      #   ★ 任务名差异（`:android:*` 用 testDebugUnitTest，其余用 test）已由 testAll 吸收。
      #   ★ :android:data 的 task 名仍需 CI 首次运行确认（`gradle :android:data:tasks --all`）；
      #     若 AGP 给出别的名字，改根 build.gradle.kts 的 testAll 一行即可（不在本文件里）。
      # ★ X5 run 归属：在 gradle 之前落一个本次 job 的 UTC 起点。
      #   没有它，门禁只看到「有 XML」；上一次遗留的 XML / FROM-CACHE 恢复的
      #   旧报告都能满足 X2。实测：FROM-CACHE 的 XML mtime 会被刷新成本次 run，
      #   只有 <testsuite timestamp> 还留着旧值，所以 X5 两条时间都查。
      - name: 记录本次 run 起点（X5 run 归属）
        run: |
          date -u +%s > "$RUNNER_TEMP/ci-run-start.epoch"
          echo "[X5] run 起点 UTC epoch=$(cat "$RUNNER_TEMP/ci-run-start.epoch")"

      # ★ --no-build-cache：CI 首跑 `shared/algorithm` 是 FROM-CACHE，23 份 XML
      #   的 <testsuite timestamp> 是两天前、hostname 是另一台 runner。缓存恢复的
      #   报告不算「本次执行」；关掉读缓存，让 8 个测试任务真的跑、产出本次 XML。
      - name: Run unit tests
        run: gradle testAll --no-daemon --console=plain --continue --no-build-cache

      # ★ 运行期 skipped 汇总（方向 1 第一步）：静态 [SKIP-SCAN] 只数源码调用点，
      #   读不到 JUnit XML 的 skipped。即使 gradle 失败，if: always() 也要跑这一步，
      #   把「哪些用例被跳过 / 哪些模块根本没出报告」打进日志；X1~X4 同时拦住
      #   「整模块空跑」「3 个模块没跑却自称全量」这两类空真绿灯；X5 校验
      #   每份 XML 的 mtime 与 <testsuite timestamp> 都晚于本次 run 起点。
      - name: 运行期 skipped 汇总（[SKIP-SCAN] XML 口径）
        if: always()
        run: python3 scripts/check-ignore-policy.py --xml --marker "$RUNNER_TEMP/ci-run-start.epoch"

      # ★ 报告上传必须覆盖**全部实际跑测的模块**（用 glob，不逐个模块硬编码）：
      #   单测报告漏传 = 失败时看不到原因，等于把 CI 变成"红了一个字"。
      #   同时收 build/test-results/**/TEST-*.xml：仅看 reports 会漏掉"NO-SOURCE 不产报告"
      #   这一类假绿（模块根本没跑测试时 reports 目录不存在，warn 也不报错）。
      #   ★ desktop/cli 没有 src/test，它的 test 必然 NO-SOURCE → 6 条 glob（results 3 + reports 3）
      #     里 desktop/cli 这一项必然为空，`if-no-files-found: warn` 只 warn 不红，
      #     所以 G1 判据必须看 XML 的 tests>0（R-07）。
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            shared/*/build/test-results/**/*.xml
            android/*/build/test-results/**/*.xml
            desktop/*/build/test-results/**/*.xml
            shared/*/build/reports/tests/**
            android/*/build/reports/tests/**
            desktop/*/build/reports/tests/**
          if-no-files-found: warn
