name: CI

# 与 Build APK（build-apk.yml，只出包）分开的两类检查：
#   1. static-guards：纯 python3，几秒钟出结果，在编译之前拦住三类"人肉 review 靠不住"的问题
#      ——吞掉协程取消信号、被跳过的测试不可溯源、隐式依赖设备默认时区；
#   2. unit-test：shared:algorithm（纯 JVM）+ app（Robolectric）单元测试。
# ★ 必须监听 pull_request：否则分支上的检查只有推送到 main 才跑，PR 里永远是空的。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-guards:
    name: Static guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ★ 三条"可重现性前提"（2026-10-31 复核）：
      #   ① python3 存在（ubuntu-24.04 预装；脚本只用标准库，不开线程、不读环境变量、不联网）；
      #   ② 脚本真的进了仓库——.gitignore 里有全局 `*.py`，靠 `!scripts/*.py` 白名单放行，
      #      白名单一旦失效，CI checkout 里根本没有这个文件，报错会是"can't open file"，
      #      看不出根因，所以在这里显式断言；
      #   ③ 脚本不依赖调用方 cwd（内部按仓库根解析相对路径），换 runner / 换 job 都成立。
      - name: 可重现性前提
        run: |
          python3 --version
          git ls-files --error-unmatch scripts/check-cancellation.py
          git ls-files --error-unmatch scripts/check-ignore-policy.py
          git ls-files --error-unmatch scripts/check-timezone.py

      # ★ 先跑内置样例自测：确认"判据本身没有退化"。
      #   门禁是自制词法分析器，没有外部依赖可对拍，最危险的回归是"规则还在、判据失效"
      #   ——表现是永远绿。自测覆盖：该报的必须报、不该报的不能报、
      #   CRLF 与 LF 判定结果完全一致（core.autocrlf 的换行差异不得影响行号/括号深度）。
      - name: 判据自测
        run: |
          python3 scripts/check-cancellation.py --selftest
          python3 scripts/check-ignore-policy.py --selftest
          python3 scripts/check-timezone.py --selftest

      # ★ 结构约束（2026-11-02 目录重组后加，跨端重构 T02 扩展）：共享层只允许存在一份。
      #   最可能被误做的三件事：① 把 shared/ 复制进 android/ 或 desktop/ 下（两份实现必然漂移）；
      #   ② 在仓库根再放一个 settings.gradle.kts（会让"根目录 gradle"又看起来能跑，CI 与本地命令分叉）；
      #   ③ 三个共享模块只在其中一端挂载（另一端会悄悄用旧副本/build 产物）。
      #   这几条都是几秒能查、但靠人 review 会漏的，直接在这里断言。
      - name: 结构约束（共享层只有一份，两端都要挂）
        run: |
          for d in android/algorithm android/shared desktop/shared; do
            if [ -e "$d" ]; then
              echo "✗ $d 不应存在：共享代码只能在仓库根的 shared/ 下，两端以 ../shared/* 挂载"; exit 1
            fi
          done
          if [ -e settings.gradle.kts ]; then
            echo "✗ 仓库根不应有 settings.gradle.kts：Android 工程根是 android/"; exit 1
          fi
          for mod in algorithm domain app; do
            grep -q "projectDir = file(\"../shared/$mod\")" android/settings.gradle.kts \
              || { echo "✗ android/settings.gradle.kts 未挂载 ../shared/$mod"; exit 1; }
            grep -q "projectDir = file(\"../shared/$mod\")" desktop/settings.gradle.kts \
              || { echo "✗ desktop/settings.gradle.kts 未挂载 ../shared/$mod"; exit 1; }
          done
          echo "✓ 两端均以 ../shared/{algorithm,domain,app} 挂载同一份共享层，仓库内无副本"

      - name: 扫描 Kotlin 源码
        run: |
          python3 scripts/check-cancellation.py android/app shared android/data
          python3 scripts/check-ignore-policy.py android/app shared android/data
          python3 scripts/check-timezone.py

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    # ★ TZ 固定为兜底，**不是正确性依据**（issue #2 决策）。
    #   历史：runner 默认 UTC，而生产代码曾有 7 处 ZoneId.systemDefault() 把 epoch 解释成本地
    #   时间 → 台账日期列偏移 8 小时、"当日零点"边界错位（CI 首次跑测试即 5 条红）。
    #   现在生产代码一律显式用 algorithm.AppZone.ID（Asia/Shanghai），并由
    #   scripts/check-timezone.py 在 static-guards 里拦截"再写回 systemDefault()"；
    #   测试侧用 TimeZone.setDefault 在进程内切换默认时区做验证，不依赖本变量。
    #   保留它只为兜住"漏网的隐式依赖"在 CI 上不会表现成随机红。
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # ★ 用例自己会兜底：依赖真实照片的 VM 用例（AppViewModelTest / ExifMergedReaderTest 等）
      #   在拿不到源照片时用 assumeTrue 跳过，因此本 job 在无照片的 runner 上是绿的，
      #   而不是"假装跑过"。慢用例（导出重入，本机 ~7.8s）同属这一类。
      # ★ 2026-11-02 目录重组：Android 端成为独立 Gradle 工程（android/settings.gradle.kts），
      #   仓库根不再有 settings —— 必须用 -p android 指定根目录，否则 gradle 在根目录直接报
      #   "Directory does not contain a Gradle build"。:shared:algorithm 由 android 工程以
      #   ../shared/algorithm 挂载，所以仍能在同一次调用里跑它的测试。
      - name: Run unit tests
        run: gradle -p android :shared:algorithm:test :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            shared/algorithm/build/reports/tests/test
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
