name: Build APK

# 推送到 main 自动构建并发布预发布版；推送 v* 标签（如 v1.0.0）自动构建并发布正式版
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # ★ 2026-10-31 新增 pull_request：main 的分支保护把「Build release APK」列为 required
  #   status check，而本 workflow 原先**只在 main/tag 触发** —— PR 上根本不会出现这个
  #   check，保护规则会变成"永远等不到 → 永远不能合入"的死锁。加上它，PR 上才会跑。
  #   两个 Release 发布步骤已有 `startsWith(github.ref, 'refs/tags/'|'refs/heads/')` 条件，
  #   PR 的 ref 是 `refs/pull/<n>/merge`，两者都不匹配 → PR 上只出包、不发布 Release。
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支/标签只保留最新构建，自动取消旧的运行中任务，避免重复构建浪费资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    # ★ 2026-10-24 固定 LTS runner + Node 24 兼容 actions：
    #   ubuntu-latest 自 10/19 迁移 Ubuntu 26；GitHub 同时强制旧 action（Node 20）迁移 Node 24，
    #   导致真实编译类构建快速失败（exit 1，~58s）；回退 ubuntu-24.04 并升级全部 action 到 Node 24 兼容版
    runs-on: ubuntu-24.04
    # 允许创建 tag 与发布 Release 所需的 contents 写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ★ 2026-10-31 复核：「吞掉协程取消信号」的门禁已移到 ci.yml 的 cancellation-guard job。
      #   理由：① 那里同时监听 pull_request 与 push，分支上就能看到结果（本 workflow 只在 main/tag 触发）；
      #        ② 那里会先跑 scripts/check-cancellation.py --selftest，确认判据没退化再扫描源码；
      #        ③ 本 workflow 只负责出包，不重复跑同一项检查（构建链上失败点越靠前越好，
      #           但同一项检查跑两遍只会拖长反馈时间）。

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 项目国内镜像已写入 settings.gradle.kts（阿里云），Actions 环境直连亦可
      # 安装 Gradle 8.10.2（与 gradle-wrapper.properties 一致），绕过仓库内无 wrapper jar 的问题
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # 正式签名：若配置了 GitHub Secrets（KEYSTORE_BASE64 等）则注入签名；
      # 未配置时 build.gradle.kts 自动回退 debug 签名（可安装使用，非正式签名）
      # 注意：使用 printf 而非 heredoc，避免 YAML 缩进导致 EOF 不闭合
      - name: Configure release signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # ★ 2026-11-02 目录重组：Android 工程根为 android/，签名目录随之改为 android/keystore/
            #   （app/build.gradle.kts 里 rootProject.file("keystore/...") 解析到 android/keystore/，
            #   同时保留对仓库根 keystore/ 的兼容探测，老开发机不用搬文件）。
            mkdir -p android/keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/photomgm-release.jks
            printf 'storeFile=keystore/photomgm-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
              "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
              "${{ secrets.KEYSTORE_KEY_PASSWORD }}" > android/keystore/keystore.properties
            echo "正式签名已注入（keystore.properties 已生成）"
          else
            echo "未配置 KEYSTORE_BASE64 → release 将回退 debug 签名（功能完整可安装）"
          fi

      - name: Build release APK
        run: gradle -p android :app:assembleRelease --no-daemon

      # AGP 8.7.3 公共 API 不支持配置 APK 输出名，构建产物为 app-release.apk；
      # 上传前重命名为 Photo-Mgm-release.apk
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Photo-Mgm-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Photo-Mgm-release-apk
          path: dist/Photo-Mgm-release.apk
          if-no-files-found: error

      # ── 正式版发布：仅 v* 标签触发（如 v1.0.0）──
      - name: Publish GitHub Release (stable, tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Photo-Mgm ${{ github.ref_name }}
          body: |
            ## Photo-Mgm ${{ github.ref_name }}
            正式发布版安装包。
            - Commit：`${{ github.sha }}`
            - 说明：请确认已配置 KEYSTORE_BASE64 等 Secrets，否则为 debug 签名。
          files: dist/Photo-Mgm-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 自动构建版发布：仅 main 分支推送触发 ──
      - name: Publish GitHub Release (auto build)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: auto-${{ github.run_number }}
          name: Photo-Mgm 自动构建 #${{ github.run_number }}
          body: |
            每次推送 main 自动生成的测试安装包。
            - 构建序号：#${{ github.run_number }}
            - Commit：`${{ github.sha }}`
            - 说明：此为自动构建（debug 签名），正式签名版请打 v* 标签发布。
          files: dist/Photo-Mgm-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
