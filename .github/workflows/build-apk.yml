name: Build APK

# 触发面：仅 v* 标签（如 v1.0.0）与手动派发。
# main 推送不再自动出 APK（项目重心在 PC 端，见 build-desktop.yml）。
# 原「main 分支保护把 Build release APK 列为 required status check」的说明已失效：
# 2026-11-07 实测 `GET /repos/.../branches/main/protection` → HTTP 404 `Branch not protected`，
# 该保护规则已不存在，故一并移除当初为它加的 pull_request 触发与 auto-N 预发布 step。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 同一分支/标签只保留最新构建，自动取消旧的运行中任务，避免重复构建浪费资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    # ★ 2026-10-24 固定 LTS runner + Node 24 兼容 actions：
    #   ubuntu-latest 自 10/19 迁移 Ubuntu 26；GitHub 同时强制旧 action（Node 20）迁移 Node 24，
    #   导致真实编译类构建快速失败（exit 1，~58s）；回退 ubuntu-24.04 并升级全部 action 到 Node 24 兼容版
    runs-on: ubuntu-24.04
    # 允许创建 tag 与发布 Release 所需的 contents 写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ★ 2026-10-31 复核：「吞掉协程取消信号」的门禁已移到 ci.yml 的 cancellation-guard job。
      #   理由：① 那里同时监听 pull_request 与 push，分支上就能看到结果（本 workflow 只在 main/tag 触发）；
      #        ② 那里会先跑 scripts/check-cancellation.py --selftest，确认判据没退化再扫描源码；
      #        ③ 本 workflow 只负责出包，不重复跑同一项检查（构建链上失败点越靠前越好，
      #           但同一项检查跑两遍只会拖长反馈时间）。

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 项目国内镜像已写入 settings.gradle.kts（阿里云），Actions 环境直连亦可
      # 安装 Gradle 8.10.2（与 gradle-wrapper.properties 一致），绕过仓库内无 wrapper jar 的问题
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # 正式签名：若配置了 GitHub Secrets（KEYSTORE_BASE64 等）则注入签名；
      # 未配置时 build.gradle.kts 自动回退 debug 签名（可安装使用，非正式签名）
      # 注意：使用 printf 而非 heredoc，避免 YAML 缩进导致 EOF 不闭合
      - name: Configure release signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # ★ M3 单根化：rootProject 是**仓库根**，所以 app/build.gradle.kts 的签名探测写成
            #   rootProject.layout.projectDirectory.file("android/keystore/…") 优先、
            #   rootProject.layout.projectDirectory.file("keystore/…") 兜底（旧开发机位置）。
            #   本 step 的注入落点仍是 android/keystore/ —— 与探测的第一优先级对应，无需搬文件。
            mkdir -p android/keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/photomgm-release.jks
            printf 'storeFile=keystore/photomgm-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
              "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
              "${{ secrets.KEYSTORE_KEY_PASSWORD }}" > android/keystore/keystore.properties
            echo "正式签名已注入（keystore.properties 已生成）"
          else
            echo "未配置 KEYSTORE_BASE64 → release 将回退 debug 签名（功能完整可安装）"
          fi

      - name: Build release APK
        run: gradle :android:app:assembleRelease --no-daemon

      # AGP 8.7.3 公共 API 不支持配置 APK 输出名，构建产物为 app-release.apk；
      # 上传前重命名为 Photo-Mgm-debug.apk（未配置 KEYSTORE_BASE64 时为 debug 签名、非发布产物）
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Photo-Mgm-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Photo-Mgm-debug-apk
          path: dist/Photo-Mgm-debug.apk
          if-no-files-found: error

      # ── 正式版发布：仅 v* 标签触发（如 v1.0.0）──
      - name: Publish GitHub Release (stable, tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Photo-Mgm ${{ github.ref_name }}（debug 签名，非发布产物）
          body: |
            ## Photo-Mgm ${{ github.ref_name }}
            未配置 KEYSTORE_BASE64 等 Secrets，产物为 debug 签名、非发布产物。
            - Commit：`${{ github.sha }}`
            - 说明：正式签名版需配置 KEYSTORE_BASE64 等 Secrets 后，由 v* 标签发布。
          files: dist/Photo-Mgm-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
