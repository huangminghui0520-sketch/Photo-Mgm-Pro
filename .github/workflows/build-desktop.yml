name: Build Windows Desktop

# Windows 桌面版（desktop/ 独立 Gradle 工程）的打包流水线。
#
# ★ 触发面刻意收窄：只在 desktop-v* 标签与手动派发时跑。
#   理由：桌面构建要拉 Compose Multiplatform 全套依赖（~10 分钟），放进每次 PR 会拖慢反馈；
#   而它的正确性由本地 `desktop/packaging/*.sh` + 安装冒烟保证，CI 只负责"标签一到就有可下载产物"。
#
# ★ 这里**同时出便携包（app-image + zip）和 MSI 安装包**：
#   windows-latest runner 自带 WiX 3.14.1，jpackage --type msi 可直接产出 MSI，
#   CI 不再依赖打包机，两种产物随 desktop-v* 标签一并发布到 GitHub Release。
on:
  push:
    tags: [ 'desktop-v*' ]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 desktop/ui/build.gradle.kts 的 packageVersion 保持一致（改版本时两处同改）
  # ★ 2026-11-04 首发定版 1.0.0：与标签 desktop-v1.0.0 对齐，产物名同步为
  #   PhotoMgm-1.0.0.msi / PhotoMgm-1.0.0-portable.zip
  DESKTOP_VERSION: 1.0.0

jobs:
  build:
    name: Build portable zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # ★ 不用 ./gradlew：两端 wrapper 的 distributionUrl 都指向腾讯云镜像（国内快、海外不稳），
      #   美国 runner 上拉分发包容易超时。改用 setup-gradle 装好的 Gradle 8.10.2 + `-p desktop`，
      #   与 ci.yml / build-apk.yml 保持一致。
      - name: Unit tests (core / cli / ui)
        run: gradle -p desktop :core:test :cli:test :ui:test --console=plain

      # :shared:algorithm 由 desktop/settings.gradle.kts 以 ../shared/algorithm 挂载，产物落在
      # desktop/build/external/shared-algorithm —— 与 Android 构建的 shared/algorithm/build 分离，互不踩。
      - name: Package app-image (createDistributable)
        run: gradle -p desktop :ui:createDistributable --console=plain

      # ★ MSI 安装包：windows-latest runner 自带 WiX 3.14.1，jpackage 可直接出 MSI（无需额外安装）。
      - name: Package MSI installer (packageMsi)
        run: gradle -p desktop :ui:packageMsi --console=plain

      - name: Compress portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "desktop/ui/build/compose/binaries/main/app/PhotoMgm"
          if (-not (Test-Path $src)) { throw "app-image 不存在：$src" }
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          $zip = "desktop/dist/PhotoMgm-$env:DESKTOP_VERSION-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          "portable zip: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Upload portable zip
        uses: actions/upload-artifact@v5
        with:
          name: PhotoMgm-desktop-portable
          path: desktop/dist/PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v5
        with:
          name: PhotoMgm-desktop-msi
          path: desktop/ui/build/compose/binaries/main/msi/PhotoMgm-${{ env.DESKTOP_VERSION }}.msi
          if-no-files-found: error

      # 仅 desktop-v* 标签发布 Release；workflow_dispatch 手动跑只出 artifact
      - name: Publish GitHub Release (desktop-v* tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PhotoMgm Desktop ${{ github.ref_name }}
          body: |
            ## PhotoMgm Windows 桌面版 ${{ github.ref_name }}
            - Commit：`${{ github.sha }}`
            - **安装包**：`PhotoMgm-${{ env.DESKTOP_VERSION }}.msi`（写入开始菜单 / 桌面快捷方式，可原地升级）
            - **绿色压缩包**：`PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip`（免安装，解压即用）
          files: |
            desktop/dist/PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip
            desktop/ui/build/compose/binaries/main/msi/PhotoMgm-${{ env.DESKTOP_VERSION }}.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
