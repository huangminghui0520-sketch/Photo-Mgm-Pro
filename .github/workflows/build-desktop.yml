name: Build Windows Desktop

# Windows 桌面版的打包流水线。
# ★ 单根多模块（M3 起）：desktop/ 是单根构建下的 `:desktop:*` 三个模块
#   （`:desktop:core` / `:desktop:cli` / `:desktop:ui`），不再是独立 Gradle 工程。
#   Gradle 根是仓库根（`settings.gradle.kts` 在根），下面所有 gradle 调用都在根执行、用全限定项目路径。
#
# ★ 触发面：push main（每次合入验打包）+ desktop-v* 标签（发版）+ 手动派发。
#   原「刻意收窄到标签」已调整：PC 端为项目重心，main 推送也验打包（约 10 分钟，拉全套
#   Compose Multiplatform 依赖），换取 PC 端每次合入都可出包。
#   **Release 发布仍只在 desktop-v* 标签触发**（见下方 `if: startsWith(github.ref, 'refs/tags/desktop-v')`）。
#
# ★ 这里**同时出便携包（app-image + zip）和 MSI 安装包**：
#   windows-latest runner 自带 WiX 3.14.1，jpackage --type msi 可直接产出 MSI，
#   CI 不再依赖打包机，两种产物随 desktop-v* 标签一并发布到 GitHub Release。
on:
  push:
    branches: [ main ]
    tags: [ 'desktop-v*' ]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 desktop/ui/build.gradle.kts 的 packageVersion 保持一致（改版本时两处同改）
  # ★ 2026-11-08 升 1.0.2（标签 desktop-v1.0.2，含 ADB 换机修复 + 缩略图滚轮 + 筛选门控）。
  #   MSI 与 portable zip 的产物名一律随本变量走，不在此处写死。
  DESKTOP_VERSION: 1.0.2

jobs:
  build:
    name: Build portable zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      # ★ 不使用仓库内的 wrapper 脚本：分发包走腾讯云镜像（国内快、海外不稳），
      #   美国 runner 上拉分发包容易超时。改用 setup-gradle 装好的 Gradle 8.10.2，与另外两个
      #   workflow 保持一致（三个 workflow 都不调用 wrapper，wrapper 只服务本地开发）。
      # ★ M5：原「Unit tests (desktop core / cli / ui + shared domain / app)」step 已**删除**。
      #   理由：ci.yml 的 `gradle testAll` 已在每次 push/PR 一次覆盖全部 8 个模块（含 desktop×3、
      #   shared×3），此处再跑一遍是纯重复 —— 桌面出包 workflow 只负责出包，单测失败由 ci.yml 拦。
      #   另有实际代价：这一步会额外拉起一次完整配置 + 编译，Windows runner 上多花约 3~5 分钟。
      #   ★ 出包前置校验仍保留：下面 createDistributable 失败即整条 workflow 红。

      # :shared:{algorithm,domain,app} 现在由**根 settings** 纳入同一构建，源码仍在 shared/ 下
      # （物理位置零移动）。单根后不再需要"把桌面侧共享层产物重定向到 external/"的补丁：
      # 8 个模块各写自己的 build 目录，全仓一份产物，不存在两份构建互踩的问题。
      - name: Package app-image (createDistributable)
        run: gradle :desktop:ui:createDistributable --console=plain

      # ★ MSI 安装包：windows-latest runner 自带 WiX 3.14.1，jpackage 可直接出 MSI（无需额外安装）。
      - name: Package MSI installer (packageMsi)
        run: gradle :desktop:ui:packageMsi --console=plain

      - name: Compress portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "desktop/ui/build/compose/binaries/main/app/PhotoMgm"
          if (-not (Test-Path $src)) { throw "app-image 不存在：$src" }
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          $zip = "desktop/dist/PhotoMgm-$env:DESKTOP_VERSION-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          "portable zip: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Upload portable zip
        uses: actions/upload-artifact@v5
        with:
          name: PhotoMgm-desktop-portable
          path: desktop/dist/PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v5
        with:
          name: PhotoMgm-desktop-msi
          path: desktop/ui/build/compose/binaries/main/msi/PhotoMgm-${{ env.DESKTOP_VERSION }}.msi
          if-no-files-found: error

      # 仅 desktop-v* 标签发布 Release；workflow_dispatch 手动跑只出 artifact
      - name: Publish GitHub Release (desktop-v* tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PhotoMgm Desktop ${{ github.ref_name }}
          body: |
            ## PhotoMgm Windows 桌面版 ${{ github.ref_name }}
            - Commit：`${{ github.sha }}`
            - **安装包**：`PhotoMgm-${{ env.DESKTOP_VERSION }}.msi`（写入开始菜单 / 桌面快捷方式，可原地升级）
            - **绿色压缩包**：`PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip`（免安装，解压即用）
          files: |
            desktop/dist/PhotoMgm-${{ env.DESKTOP_VERSION }}-portable.zip
            desktop/ui/build/compose/binaries/main/msi/PhotoMgm-${{ env.DESKTOP_VERSION }}.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
