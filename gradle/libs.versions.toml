# Photo-Mgm 版本单点来源（Gradle Version Catalog，自动被 settings.gradle.kts 加载）。
#
# ★ 落地节奏（方案 §4.2.3）：M2/M3 只让根 build.gradle.kts 的 [plugins] 走 alias；
#   [libraries] 的坐标仍在各模块脚本里写字面量，alias 化留到 M5 单独提交（等价替换、坐标不变）。
#   这样 M3 的原子提交不会变成 12+ 文件的大爆炸。
#
# ★ 本文件里的版本全部来自源码实读（逐行来源见各行的 `#` 注释），不是猜的。

[versions]
# ── 构建工具链（已核实）────────────────────────────────────────────
kotlin               = "2.0.21"   # android/build.gradle.kts:4-7, desktop/build.gradle.kts:9,11
agp                  = "8.7.3"    # android/build.gradle.kts:9-10
composeMultiplatform = "1.7.3"    # desktop/build.gradle.kts:13
gradle               = "8.10.2"   # 两端 gradle-wrapper.properties:3, ci.yml 的 setup-gradle
jdk                  = "17"       # 各模块 toolchain(17) / jvmTarget 17
compileSdk           = "34"       # android/app/build.gradle.kts:26
minSdk               = "26"       # android/app/build.gradle.kts:29
targetSdk            = "34"       # android/app/build.gradle.kts:30
appVersionCode       = "7"        # android/app/build.gradle.kts:33
appVersionName       = "1.0.0"    # android/app/build.gradle.kts:34
desktopVersion       = "1.0.0"    # desktop/ui/build.gradle.kts 的 packageVersion, build-desktop.yml 的 DESKTOP_VERSION

# ── 运行时依赖（已核实；共享层唯一第三方运行时依赖是 coroutines-core）──
# ★ 显式决定（方案 §3.6）：以下两键**故意不同**，不是笔误，也不合并成单个 coroutines 键。
#   core 1.9.0 = 共享层唯一第三方运行时依赖（shared/app、desktop/core）；
#   test 1.7.3 = android/app 的测试依赖，与当时解析出的 core 版本对齐。
#   本方案只改构建拓扑，**不改任何依赖版本**（N5/N10）；统一到 1.9.0 属版本变更，
#   须另案单独提交，且要先 CI 实跑确认 runTest / StandardTestDispatcher / Dispatchers.setMain
#   在 1.9.0 下兼容。
coroutinesCore       = "1.9.0"    # shared/app/build.gradle.kts, desktop/core/build.gradle.kts（已知与下行不一致，保留原值）
coroutinesTest       = "1.7.3"    # android/app/build.gradle.kts 的 kotlinx-coroutines-test（已知不一致，保留原值）
metadataExtractor    = "2.19.0"   # desktop/core/build.gradle.kts
exifinterface        = "1.3.7"    # android/data/build.gradle.kts
androidxCoreKtx      = "1.12.0"   # android/data/build.gradle.kts
composeBom           = "2024.04.00" # android/app/build.gradle.kts
activityCompose      = "1.8.2"    # android/app/build.gradle.kts
lifecycleViewmodel   = "2.7.0"    # android/app/build.gradle.kts
navigationCompose    = "2.7.7"    # android/app/build.gradle.kts
coilCompose          = "2.5.0"    # android/app/build.gradle.kts
documentfile         = "1.0.1"    # android/app/build.gradle.kts

# ── 仅测试依赖（已核实）─────────────────────────────────────────────
junitJupiter         = "5.10.2"   # shared/*/build.gradle.kts, android/app
junitPlatform        = "1.10.2"   # android/app/build.gradle.kts
junitVintage         = "5.10.2"   # android/data/build.gradle.kts, android/app
junit4               = "4.13.2"   # android/data/build.gradle.kts
robolectric          = "4.12.2"   # android/data/build.gradle.kts, android/app
androidxTestCore     = "1.5.0"    # android/data/build.gradle.kts, android/app
androidxTestExtJunit = "1.1.5"    # android/app/build.gradle.kts
androidxTestRunner   = "1.5.2"    # android/app/build.gradle.kts
poiOoxml             = "5.2.5"    # shared/algorithm/build.gradle.kts, desktop/core

# ── 外部事实（待核，仅登记不用于构建）──────────────────────────────
# kotlinAgpCompat     = "待核"    # Kotlin 2.0.21 × AGP 8.7.3 官方矩阵，需 CI 实跑
# kotlinCmpCompat     = "待核"    # Kotlin 2.0.21 × CMP 1.7.3，desktop/build.gradle.kts 注释称官方兼容组合
# androidxLifecycle   = "2.8.5"   # CMP 传递依赖（只发布在 Google Maven），非本仓直接声明

[libraries]
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesCore" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
metadata-extractor          = { module = "com.drewnoakes:metadata-extractor", version.ref = "metadataExtractor" }
androidx-exifinterface      = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-compose-bom        = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-vm       = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodel" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
coil-compose                = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
androidx-documentfile       = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
junit-jupiter               = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher     = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
junit-vintage-engine        = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVintage" }
junit4                      = { module = "junit:junit", version.ref = "junit4" }
robolectric                 = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core          = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit     = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner        = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
poi-ooxml                   = { module = "org.apache.poi:poi-ooxml", version.ref = "poiOoxml" }

[plugins]
# 6 个插件 id 必须与「M3 删除的 8 行带版本声明」的 id 集合一致，否则根 alias 覆盖不全：
#   kotlin.jvm / kotlin.android / kotlin.plugin.compose /
#   com.android.application / com.android.library / org.jetbrains.compose
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
android-application     = { id = "com.android.application",                version.ref = "agp" }
android-library         = { id = "com.android.library",                    version.ref = "agp" }
compose-multiplatform   = { id = "org.jetbrains.compose",                  version.ref = "composeMultiplatform" }
